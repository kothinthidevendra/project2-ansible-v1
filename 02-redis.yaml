- name: configuration of redis server
  hosts: redis
  become: yes
  tasks:
  - name: enabling the redis7 module
    command: dnf module enable redis:7 -y

  - name: installation of redis server
    package:
      name: redis
      state: present

  - name: enabling remote connectivity
    replace:
      path: /etc/redis/redis.conf
      regexp: '127.0.0.1'
      replace: '0.0.0.0'

  - name: disabling protection mode
    lineinfile:
      path: /etc/redis/redis.conf
      regexp: 'protected-mode yes'
      line: 'protected-mode no'

  - name: enabling and strating the redis server
    service:
      name: redis
      state: restarted
      enabled: yes
      
