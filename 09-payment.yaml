- name: configuration of payment server
  hosts: payment
  become: yes
  tasks:
  - name: installation of python
    package:
      name:
      - python3.14
      - python3.14-pip
    state: present

  - name: creation of system user for application 
    user:
      name: roboshop
      create_home: false
      home: /app
      system: true
      shell: /sbin/nologin
      comment: "roboshop user"

  - name: deletion of app folder if exists
    file:
      path: /app
      state: absent

  - name: deletion of code zip folder if exists
    file:
      path: /tmp/payment.zip
      state: absent

  - name: creation of app folder
    file:
      path: /app
      state: directory

  - name: Downloading the code
    get_url: 
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/payment-v4.zip
      dest: /tmp/payment.zip

  - name: extractoin of code
    unarchive:
      src: /tmp/payment.zip
      dest: /app
      remote_src: yes

  - name: install dependencies
    ansible.builtin.pip:
      requirements: /app/requirements.txt
      virtualenv: /app/.venv
      virtualenv_command: python3.14 -m venv

  - name: copy payment service
    template:
      src: payment.service.j2
      dest: /etc/systemd/system/payment.service

  - name: daemon reload
    systemd_service:
      daemon_reload: true

  - name: start and enable payment
    service:
      name: payment
      state: started
      enabled: yes