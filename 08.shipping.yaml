- name: configuration of shipping server
  hosts: shipping
  become: yes
  tasks:
  - name: enabling the maven3.9 module
    command: dnf module enable maven:3.9 -y

  - name: installation of maven3.9
    package: 
      name: 
      - maven
      - java-25-openjdk-devel
      - maven-openjdk25
      - mysql
      state: present

  - name: creation of system user for application
    user:
      name: roboshop
      create_home: false
      home: /app
      system: true
      shell: /sbin/nologin
      comment: "roboshop user"

  - name: deletion of app folder if exists
    file:
      path: /app
      state: absent

  - name: deletion of code zip folder if exists
    file:
      path: /tmp/shipping.zip
      state: absent

  - name: creation of app folder
    file:
      path: /app
      state: directory

  - name: Downloading the code
    get_url: 
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/shipping-v4.zip
      dest: /tmp/shipping.zip

  - name: extractoin of code
    unarchive:
      src: /tmp/shipping.zip
      dest: /app
      remote_src: yes

  - name: installation of dependencies
    command: mvn clean package
    args:
      chdir: /app 
  
  - name: move shipping jar file
    command: mv target/shipping.jar shipping.jar
    args:
      chdir: /app

  - name: check if cities are loaded or not
    command: mysql -h "{{ mysql_host }}" -u root -p{{ mysql_root_password }} -N -B -e "SELECT COUNT(*) FROM cities.cities;"
    register: cities_count
    ignore_errors: true
    
  - name: print cities_count
    debug:
      msg: "{{ cities_count }}"

  - name: load cities data to mysql
    shell: mysql -h "{{ mysql_host }}" -u root -p{{ mysql_root_password }} < /app/db/master-data.sql
    when: cities_count.rc != 0 or cities_count.stdout | int == 0

  - name: create app user
    shell: mysql -h "{{ mysql_host }}" -u root -p{{ mysql_root_password }} < /app/db/app-user.sql

  - name: creation of systemd service
    target:
      src: shipping.service.j2
      dest: /etc/systemd/system/shipping.service

  - name: daemon-reload
    systemd_service:
      daemon_reload: true

  - name: enable and start the service
    package:
      name: shipping
      state: restarted
      enabled: yes




