- name: configuration of mysql server
  hosts: mysql
  become: yes
  tasks:
  - name: enabling mysql module
    command: dnf module enable mysql:8.4 -y

  - name: installation of mysql server
    package:
      name: mysql-server
      state: present

  - name: enabling & starting the server
    service:
      name: mysqld
      state: started
      enabled: yes

  - name: setting the root password
    command: mysql_secure_installation --set-root-pass "{{ mysql_root_password }}"
    